<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WortSchatz! 🇩🇪 - Learning Edition</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Fun Cartoony Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Modernized UI & Animation Enhancements */
    .cartoon-card {
      background-color: #ffffff;
      border: 3.5px solid #1e293b;
      box-shadow: 4px 4px 0px #1e293b;
      border-radius: 1.25rem;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cartoon-btn {
      border: 3px solid #1e293b;
      box-shadow: 0px 4px 0px #1e293b;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      font-weight: 700;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cartoon-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0px 5px 0px #1e293b;
    }

    .cartoon-btn:active {
      transform: translateY(3px);
      box-shadow: 0px 1px 0px #1e293b;
    }

    .cartoon-input {
      border: 3px solid #1e293b;
      box-shadow: inset 0px 2px 4px rgba(0,0,0,0.06);
      font-size: 16px !important;
      min-height: 44px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .cartoon-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0px 0px 0px 3px #c7d2fe, inset 0px 2px 4px rgba(0,0,0,0.06);
    }

    /* Drag-and-Drop styles for workspaces/decks */
    .draggable-item {
      cursor: grab;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .draggable-item:active {
      cursor: grabbing;
    }

    .draggable-item.dragging {
      opacity: 0.4;
      transform: scale(0.98);
      box-shadow: 0px 0px 0px #1e293b;
    }

    .draggable-item.drag-over {
      transform: scale(1.02);
      box-shadow: 6px 6px 0px #4f46e5;
    }

    /* Swipe Card Animations */
    .swipe-card {
      transition: transform 0.25s ease, opacity 0.25s ease;
      cursor: grab;
    }
    .swipe-card:active {
      cursor: grabbing;
    }

    /* Refined Animations */
    @keyframes smoothPopIn {
      0% { 
        transform: scale(0.97); 
        opacity: 0; 
      }
      100% { 
        transform: scale(1); 
        opacity: 1; 
      }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .animate-pop {
      animation: smoothPopIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-shake {
      animation: gentleShake 0.25s ease-in-out;
    }
  </style>
</head>
<body class="bg-amber-100/80 text-slate-800 p-2 sm:p-8 min-h-screen flex flex-col justify-center items-center">

  <div class="w-full max-w-2xl cartoon-card bg-white overflow-hidden my-auto animate-pop relative">
    
    <!-- HEADER -->
    <header class="bg-amber-300 border-b-4 border-slate-800 p-3 sm:p-5 flex flex-col sm:flex-row justify-between items-center gap-3 relative overflow-hidden">
      <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center gap-2">
          <span class="text-2xl sm:text-4xl inline-block">🧠</span>
          <div>
            <h1 class="text-lg sm:text-3xl font-bold tracking-wide text-slate-900 leading-none">WortSchatz!</h1>
            <p class="text-slate-700 text-[11px] sm:text-sm font-semibold mt-1">Vocabulary App!</p>
          </div>
        </div>
        
        <button id="homeBtn" onclick="playSound('click'); renderHomeView()" class="hidden cartoon-btn bg-indigo-400 hover:bg-indigo-500 text-white text-xs px-3 rounded-xl sm:hidden">
          🏠 Home
        </button>
      </div>

      <!-- STREAK & STATS HEADER DISPLAY -->
      <div class="grid grid-cols-4 sm:flex items-center gap-1.5 sm:gap-2.5 w-full sm:w-auto justify-between sm:justify-end">
        <div class="bg-white border-2 border-slate-800 rounded-xl px-2 py-1 text-center flex flex-col sm:flex-row items-center gap-1 shadow-sm" title="Total Words Across Workspaces">
          <span class="text-sm sm:text-lg">📚</span>
          <div class="text-left">
            <div class="text-[9px] sm:text-[10px] font-black uppercase text-slate-500 leading-tight">Total</div>
            <div id="totalWordsCount" class="text-[11px] sm:text-sm font-extrabold text-indigo-600 leading-none">0</div>
          </div>
        </div>

        <div class="bg-white border-2 border-slate-800 rounded-xl px-2 py-1 text-center flex flex-col sm:flex-row items-center gap-1 shadow-sm" title="Daily Activity Streak">
          <span class="text-sm sm:text-lg">🔥</span>
          <div class="text-left">
            <div class="text-[9px] sm:text-[10px] font-black uppercase text-slate-500 leading-tight">Streak</div>
            <div id="streakCount" class="text-[11px] sm:text-sm font-extrabold text-orange-600 leading-none">0d</div>
          </div>
        </div>

        <div class="bg-white border-2 border-slate-800 rounded-xl px-2 py-1 text-center flex flex-col sm:flex-row items-center gap-1 shadow-sm" title="Mastered Words (Box 5)">
          <span class="text-sm sm:text-lg">🎓</span>
          <div class="text-left">
            <div class="text-[9px] sm:text-[10px] font-black uppercase text-slate-500 leading-tight">Master</div>
            <div id="masteredCount" class="text-[11px] sm:text-sm font-extrabold text-emerald-600 leading-none">0</div>
          </div>
        </div>

        <div class="flex items-center gap-1 justify-self-end">
          <button id="muteBtn" onclick="toggleMute()" class="cartoon-btn bg-white hover:bg-slate-100 text-slate-800 text-sm sm:text-base px-2 rounded-xl" title="Toggle Sound Effects">
            🔊
          </button>
          <button id="homeBtnDesktop" onclick="playSound('click'); renderHomeView()" class="hidden sm:inline-flex cartoon-btn bg-indigo-400 hover:bg-indigo-500 text-white text-xs sm:text-sm px-3 sm:px-4 rounded-xl">
            🏠 Home
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="appContainer" class="p-3 sm:p-6">
      <!-- Dynamic Views Inject Here -->
    </main>

  </div>

  <!-- CONJUGATION TABLE MODAL OVERLAY -->
  <div id="conjugationModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-4 hidden animate-pop">
    <div class="cartoon-card bg-amber-50 w-full max-w-md p-4 sm:p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b-3 border-slate-800 mb-3 shrink-0">
        <div>
          <span class="text-[10px] sm:text-xs font-black uppercase tracking-wider bg-teal-200 text-teal-900 px-2 py-0.5 rounded border border-slate-800">Conjugation Table</span>
          <h3 id="modalVerbTitle" class="text-lg sm:text-2xl font-black text-slate-900 mt-1">machen</h3>
        </div>
        <button onclick="closeConjugationModal()" class="cartoon-btn bg-rose-300 hover:bg-rose-400 text-slate-900 px-3 rounded-xl text-sm">
          ✕
        </button>
      </div>
      
      <p class="text-[11px] sm:text-xs font-bold text-slate-600 mb-3 shrink-0">Automatically generated conjugations. You can customize any cell and save!</p>

      <div id="modalTableContent" class="space-y-2 mb-4 overflow-y-auto pr-1 flex-1">
        <!-- Injected table rows with inputs -->
      </div>

      <div class="flex flex-col sm:flex-row gap-2 shrink-0">
        <button onclick="saveUserConjugationTable()" class="cartoon-btn flex-1 bg-emerald-400 hover:bg-emerald-500 text-slate-900 font-bold rounded-xl py-2 text-sm">
          Save Customization 💾
        </button>
        <button onclick="closeConjugationModal()" class="cartoon-btn bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-xl py-2 px-4 text-sm">
          Close 👍
        </button>
      </div>
    </div>
  </div>

  <!-- IMPORT WORDS MODAL OVERLAY -->
  <div id="importModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-4 hidden animate-pop">
    <div class="cartoon-card bg-amber-50 w-full max-w-lg p-4 sm:p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b-3 border-slate-800 mb-3 shrink-0">
        <div>
          <span class="text-[10px] sm:text-xs font-black uppercase tracking-wider bg-indigo-200 text-indigo-900 px-2 py-0.5 rounded border border-slate-800">Batch Import</span>
          <h3 class="text-lg sm:text-2xl font-black text-slate-900 mt-1">📥 Import Word List</h3>
        </div>
        <button onclick="closeImportModal()" class="cartoon-btn bg-rose-300 hover:bg-rose-400 text-slate-900 px-3 rounded-xl text-sm">
          ✕
        </button>
      </div>
      
      <p class="text-[11px] sm:text-xs font-bold text-slate-600 mb-2 shrink-0">
        Paste your list below. Format: <code class="bg-white px-1 py-0.5 rounded border border-slate-800 font-mono">German | English | Example</code>.
      </p>

      <div class="mb-3 shrink-0">
        <textarea id="importTextarea" rows="5" placeholder="lernen | to learn | Ich lerne Deutsch every day.&#10;sprechen | to speak | Sprichst du Deutsch?" class="cartoon-input w-full p-3 rounded-xl text-xs sm:text-sm font-mono bg-white"></textarea>
      </div>

      <div class="flex flex-col sm:flex-row gap-2 shrink-0">
        <button onclick="processBatchImport()" class="cartoon-btn flex-1 bg-emerald-400 hover:bg-emerald-500 text-slate-900 font-bold rounded-xl py-2 text-sm">
          Import Words 🚀
        </button>
        <button onclick="closeImportModal()" class="cartoon-btn bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl py-2 px-4 text-sm">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script>
    // AUDIO GENERATOR & MUTE CONTROL
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isMuted = false;

    function toggleMute() {
      isMuted = !isMuted;
      const muteBtn = document.getElementById('muteBtn');
      if (muteBtn) {
        muteBtn.innerText = isMuted ? '🔇' : '🔊';
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'correct') {
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);

          noteOsc.type = 'triangle';
          noteOsc.frequency.setValueAtTime(freq, now + idx * 0.06);

          noteGain.gain.setValueAtTime(0.15, now + idx * 0.06);
          noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);

          noteOsc.start(now + idx * 0.06);
          noteOsc.stop(now + idx * 0.06 + 0.25);
        });
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'delete') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'victory') {
        const arpeggio = [440, 554.37, 659.25, 880];
        arpeggio.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);

          noteOsc.type = 'sine';
          noteOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
          noteGain.gain.setValueAtTime(0.15, now + idx * 0.08);
          noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

          noteOsc.start(now + idx * 0.08);
          noteOsc.stop(now + idx * 0.08 + 0.3);
        });
      }
    }

    // AUTOMATIC GERMAN VERB CONJUGATION ENGINE
    function autoConjugateVerb(infinitive) {
      let v = infinitive.trim().toLowerCase();
      v = v.replace(/^zu\s+/, '');

      const irregulars = {
        'sein': { 'ich': 'bin', 'du': 'bist', 'er / sie / es': 'ist', 'wir': 'sind', 'ihr': 'seid', 'sie / Sie': 'sind' },
        'haben': { 'ich': 'habe', 'du': 'hast', 'er / sie / es': 'hat', 'wir': 'haben', 'ihr': 'habt', 'sie / Sie': 'haben' },
        'werden': { 'ich': 'werde', 'du': 'wirst', 'er / sie / es': 'wird', 'wir': 'werden', 'ihr': 'werdet', 'sie / Sie': 'werden' },
        'wissen': { 'ich': 'weiß', 'du': 'weißt', 'er / sie / es': 'weiß', 'wir': 'wissen', 'ihr': 'wisst', 'sie / Sie': 'wissen' },
        'sprechen': { 'ich': 'spreche', 'du': 'sprichst', 'er / sie / es': 'spricht', 'wir': 'sprechen', 'ihr': 'sprecht', 'sie / Sie': 'sprechen' },
        'lesen': { 'ich': 'lese', 'du': 'liest', 'er / sie / es': 'liest', 'wir': 'lesen', 'ihr': 'lest', 'sie / Sie': 'lesen' },
        'sehen': { 'ich': 'sehe', 'du': 'siehst', 'er / sie / es': 'sieht', 'wir': 'sehen', 'ihr': 'seht', 'sie / Sie': 'sehen' },
        'essen': { 'ich': 'esse', 'du': 'isst', 'er / sie / es': 'isst', 'wir': 'essen', 'ihr': 'esst', 'sie / Sie': 'essen' },
        'fahren': { 'ich': 'fahre', 'du': 'fährst', 'er / sie / es': 'fährt', 'wir': 'fahren', 'ihr': 'fahrt', 'sie / Sie': 'fahren' },
        'laufen': { 'ich': 'laufe', 'du': 'läufst', 'er / sie / es': 'läuft', 'wir': 'laufen', 'ihr': 'lauft', 'sie / Sie': 'laufen' },
        'schlafen': { 'ich': 'schlafe', 'du': 'schläfst', 'er / sie / es': 'schläft', 'wir': 'schlafen', 'ihr': 'schlaft', 'sie / Sie': 'schlafen' },
        'geben': { 'ich': 'gebe', 'du': 'gibst', 'er / sie / es': 'gibt', 'wir': 'geben', 'ihr': 'gebt', 'sie / Sie': 'geben' },
        'nehmen': { 'ich': 'nehme', 'du': 'nimmst', 'er / sie / es': 'nimmt', 'wir': 'nehmen', 'ihr': 'nehmt', 'sie / Sie': 'nehmen' }
      };

      if (irregulars[v]) {
        return irregulars[v];
      }

      let stem = v;
      if (v.endsWith('en')) {
        stem = v.slice(0, -2);
      } else if (v.endsWith('n')) {
        stem = v.slice(0, -1);
      }

      let stemDu = stem;
      let stemEr = stem;

      if (stem.endsWith('e') && !['stehen'].includes(v)) {
        let baseWithoutLastE = stem.slice(0, -1);
        if (baseWithoutLastE.endsWith('spr')) {
          stemDu = 'sprich';
          stemEr = 'spricht';
        } else if (baseWithoutLastE.endsWith('les')) {
          stemDu = 'liest';
          stemEr = 'liest';
        } else if (baseWithoutLastE.endsWith('seh')) {
          stemDu = 'sieht';
          stemEr = 'sieht';
        }
      }

      let ichEnd = 'e';
      if (stem.endsWith('ieren')) {
        stem = stem.replace(/ieren$/, 'ier');
      }

      let duEnding = 'st';
      if (stem.endsWith('s') || stem.endsWith('ß') || stem.endsWith('z') || stem.endsWith('x')) {
        duEnding = 't';
      }

      let tEndingEr = 't';
      let tEndingIhr = 't';
      if (stem.endsWith('t') || stem.endsWith('d')) {
        tEndingEr = 'et';
        tEndingIhr = 'et';
      }

      return {
        'ich': stem + ichEnd,
        'du': stemDu + duEnding,
        'er / sie / es': stemEr + tEndingEr,
        'wir': v,
        'ihr': stem + tEndingIhr,
        'sie / Sie': v
      };
    }

    const SRS_INTERVALS = [0, 1, 3, 7, 14, 30]; // Box 1-5

    // DEFAULT DATA STRUCTURE
    const defaultWorkspaces = [
      { id: 'ws_a1', name: '🇩🇪 A1 - Beginner', color: 'bg-emerald-200' },
      { id: 'ws_a2', name: '🌍 A2 - Elementary', color: 'bg-sky-200' }
    ];

    const defaultCategories = [
      { id: 'verbs_deck', workspaceId: 'ws_a1', name: '⚡ Verbs & Conjugation', color: 'bg-teal-200', type: 'verbs' },
      { id: 'a1_basics', workspaceId: 'ws_a1', name: '✨ Basics & Greetings', color: 'bg-amber-200' },
      { id: 'food', workspaceId: 'ws_a2', name: '🍕 Food & Drink', color: 'bg-rose-200' }
    ];

    const defaultWords = [
      { id: 'v1', categoryId: 'verbs_deck', german: 'lernen', english: 'to learn', example: 'Ich lerne jeden Tag Deutsch.', box: 1, nextReview: 0, attempts: 0, correct: 0, starred: false, conjugations: {} },
      { id: 'v2', categoryId: 'verbs_deck', german: 'sprechen', english: 'to speak', example: 'Sprichst du Englisch?', box: 2, nextReview: 0, attempts: 0, correct: 0, starred: false, conjugations: {} },
      { id: '1', categoryId: 'a1_basics', german: 'der Apfel', english: 'apple', example: 'Ich esse einen roten Apfel.', box: 1, nextReview: 0, attempts: 0, correct: 0, starred: false },
      { id: '2', categoryId: 'food', german: 'die Milch', english: 'milk, dairy', example: 'Trinkst du Kaffee mit Milch?', box: 2, nextReview: 0, attempts: 0, correct: 0, starred: false }
    ];

    const categoryColors = [
      'bg-amber-200', 'bg-emerald-200', 'bg-sky-200', 'bg-rose-200', 
      'bg-purple-200', 'bg-lime-200', 'bg-orange-200', 'bg-teal-200'
    ];

    // LOCAL STORAGE & INITIALIZATION
    let workspaces = JSON.parse(localStorage.getItem('gh_workspaces')) || defaultWorkspaces;
    let categories = JSON.parse(localStorage.getItem('gh_categories')) || defaultCategories;
    let words = (JSON.parse(localStorage.getItem('gh_words')) || defaultWords).map(w => ({
      ...w,
      box: w.box || 1,
      nextReview: w.nextReview || 0,
      attempts: w.attempts || 0,
      correct: w.correct || 0,
      starred: w.starred || false,
      conjugations: w.conjugations || {}
    }));

    let streakData = JSON.parse(localStorage.getItem('gh_streak')) || {
      count: 1,
      lastActiveDate: new Date().toISOString().slice(0, 10)
    };

    function updateStreak() {
      const today = new Date().toISOString().slice(0, 10);
      if (streakData.lastActiveDate === today) return;

      const lastDate = new Date(streakData.lastActiveDate);
      const currDate = new Date(today);
      const diffTime = Math.abs(currDate - lastDate);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays === 1) {
        streakData.count += 1;
      } else if (diffDays > 1) {
        streakData.count = 1;
      }
      streakData.lastActiveDate = today;
      localStorage.setItem('gh_streak', JSON.stringify(streakData));
      updateHeaderStats();
    }

    function updateHeaderStats() {
      const streakElem = document.getElementById('streakCount');
      const masteredElem = document.getElementById('masteredCount');
      const totalWordsElem = document.getElementById('totalWordsCount');

      if (streakElem) streakElem.innerText = `${streakData.count}d`;
      if (masteredElem) {
        const mastered = words.filter(w => w.box === 5).length;
        masteredElem.innerText = `${mastered}`;
      }
      if (totalWordsElem) {
        const total = words.length;
        totalWordsElem.innerText = `${total}`;
      }
    }

    function saveData() {
      localStorage.setItem('gh_workspaces', JSON.stringify(workspaces));
      localStorage.setItem('gh_categories', JSON.stringify(categories));
      localStorage.setItem('gh_words', JSON.stringify(words));
      updateHeaderStats();
    }

    function updateWordSRS(wordId, isCorrect) {
      updateStreak();
      const word = words.find(w => w.id === wordId);
      if (!word) return;

      word.attempts = (word.attempts || 0) + 1;
      if (isCorrect) {
        word.correct = (word.correct || 0) + 1;
        word.box = Math.min(5, (word.box || 1) + 1);
      } else {
        word.box = 1;
      }

      const intervalDays = SRS_INTERVALS[word.box];
      word.nextReview = Date.now() + (intervalDays * 24 * 60 * 60 * 1000);
      saveData();
    }

    function toggleStar(wordId, event) {
      if (event) event.stopPropagation();
      playSound('click');
      const word = words.find(w => w.id === wordId);
      if (word) {
        word.starred = !word.starred;
        saveData();
        renderCategoryView();
      }
    }

    // APP STATE
    let selectedWorkspace = null;
    let selectedCategory = null;
    let editingWordId = null;
    let isEditingCategoryName = false;
    let isEditingWorkspaceName = false;
    let testWords = [];

    function processBatchImport() {
      const textarea = document.getElementById('importTextarea');
      if (!textarea || !selectedCategory) return;

      const rawText = textarea.value.trim();
      if (!rawText) {
        alert('Please paste or enter some lines to import.');
        return;
      }

      const lines = rawText.split('\n');
      let importedCount = 0;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        let parts = [];
        if (trimmed.includes('|')) {
          parts = trimmed.split('|').map(p => p.trim());
        } else if (trimmed.includes('\t')) {
          parts = trimmed.split('\t').map(p => p.trim());
        } else if (trimmed.includes(',')) {
          parts = trimmed.split(',').map(p => p.trim());
        } else {
          parts = [trimmed];
        }

        const german = parts[0] || '';
        const english = parts[1] || '';
        const example = parts[2] || '';

        if (german && english) {
          words.push({
            id: 'imp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            categoryId: selectedCategory.id,
            german,
            english,
            example,
            box: 1,
            nextReview: 0,
            attempts: 0,
            correct: 0,
            starred: false,
            conjugations: {}
          });
          importedCount++;
        }
      });

      if (importedCount > 0) {
        saveData();
        playSound('correct');
        if (typeof confetti === 'function') confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
        closeImportModal();

      }
    }

    function speakGerman(text) {
      initAudio();
      if (!('speechSynthesis' in window)) return;

      if (voices.length === 0) {
        voices = window.speechSynthesis.getVoices();
      }

      window.speechSynthesis.cancel();

      const options = text.split(/[/,;]+/).map(opt => opt.trim()).filter(Boolean);
      const germanVoice = voices.find(v => v.lang === 'de-DE') || 
                          voices.find(v => v.lang.startsWith('de')) ||
                          voices.find(v => v.lang.includes('de'));

      options.forEach((opt) => {
        const utterance = new SpeechSynthesisUtterance(opt);
        utterance.lang = 'de-DE';
        utterance.pitch = 1.0;
        utterance.rate = 0.85;

        if (germanVoice) {
          utterance.voice = germanVoice;
        }

        window.speechSynthesis.speak(utterance);
      });
    }

    function getLevenshteinDistance(a, b) {
      const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
      for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return matrix[a.length][b.length];
    }

    function checkAnswerMatch(userInput, targetAnswerField) {
      const cleanInput = userInput.trim().toLowerCase();
      const validOptions = targetAnswerField.split(/[/,;]+/).map(opt => opt.trim().toLowerCase());

      for (const target of validOptions) {
        if (cleanInput === target) return true;
        const maxDistance = Math.max(2, Math.floor(target.length * 0.25));
        if (getLevenshteinDistance(cleanInput, target) <= maxDistance) {
          return true;
        }
      }
      return false;
    }

    function addCategory(e) {
      e.preventDefault();
      playSound('correct');
      const input = document.getElementById('newCategoryInput');
      const nameVal = input.value.trim();
      if (nameVal && selectedWorkspace) {
        const id = 'cat_' + Date.now();
        const color = categoryColors[categories.length % categoryColors.length];
        const isVerbs = nameVal.toLowerCase().includes('verb');
        categories.push({ 
          id, 
          workspaceId: selectedWorkspace.id,
          name: (isVerbs ? '⚡ ' : '⭐ ') + nameVal, 
          color, 
          type: isVerbs ? 'verbs' : 'normal' 
        });
        saveData();
        renderWorkspaceView();
      }
    }

    function deleteCategory(catId, event) {
      if (event) event.stopPropagation();
      playSound('delete');
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;

      if (confirm(`Boom! 💥 Delete deck "${cat.name}" and all words inside it?`)) {
        categories = categories.filter(c => c.id !== catId);
        words = words.filter(w => w.categoryId !== catId);
        saveData();
        renderWorkspaceView();
      }
    }

    function selectCategory(catId) {
      selectedCategory = categories.find(c => c.id === catId);
      isEditingCategoryName = false;
      deckSearchQuery = '';
      renderCategoryView();
    }

    function startCategoryNameEdit() {
      playSound('click');
      isEditingCategoryName = true;
      renderCategoryView();
    }

    function cancelCategoryNameEdit() {
      playSound('click');
      isEditingCategoryName = false;
      renderCategoryView();
    }

    function saveCategoryName() {
      playSound('correct');
      const input = document.getElementById('categoryNameInput');
      if (input) {
        const newName = input.value.trim();
        if (newName) {
          selectedCategory.name = newName;
          if (newName.toLowerCase().includes('verb')) {
            selectedCategory.type = 'verbs';
          }
          saveData();
        }
      }
      isEditingCategoryName = false;
      renderCategoryView();
    }

    function getSelectedCategoryWords() {
      if (!selectedCategory) return [];
      let catWords = words.filter(w => w.categoryId === selectedCategory.id);
      if (deckSearchQuery && deckSearchQuery.trim() !== '') {
        const query = deckSearchQuery.trim().toLowerCase();
        catWords = catWords.filter(w => 
          w.german.toLowerCase().includes(query) || 
          w.english.toLowerCase().includes(query) ||
          (w.example && w.example.toLowerCase().includes(query))
        );
      }
      return catWords;
    }

    function handleDeckSearchInput(e) {
      deckSearchQuery = e.target.value;
      const wordListContainer = document.getElementById('wordListContainer');
      if (wordListContainer) {
        const categoryWords = getSelectedCategoryWords();
        wordListContainer.innerHTML = buildWordListHtml(categoryWords);
      }
    }

        return `
          <div class="text-center p-6 text-slate-400 font-bold italic text-xs sm:text-sm">

      const isVerbsDeck = selectedCategory && (selectedCategory.type === 'verbs' || selectedCategory.name.toLowerCase().includes('verb'));

      return categoryWords.map(w => {
        if (editingWordId === w.id) {
          return `

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

                <input type="text" id="editEnglish_${w.id}" value="${w.english.replace(/"/g, '&quot;')}" class="cartoon-input px-3 rounded-xl text-xs sm:text-sm font-bold" placeholder="English meaning">

              <input type="text" id="editExample_${w.id}" value="${(w.example || '').replace(/"/g, '&quot;')}" class="cartoon-input px-3 rounded-xl text-xs sm:text-sm font-semibold" placeholder="Example sentence">

                  <span>Acc: ${w.attempts > 0 ? `${accuracy}%` : 'New'}</span>
                </div>
                ${w.example ? `<p class="text-[11px] text-indigo-600 font-semibold italic mt-0.5 truncate">💬 "${w.example}"</p>` : ''}

            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${showTableBtn ? `
                <button onclick="openConjugationModal('${w.id}')" class="cartoon-btn bg-teal-200 hover:bg-teal-300 text-slate-900 px-2 rounded-xl text-[11px] sm:text-xs" title="Table">
                  📊 Table

              <button onclick="playSound('click'); startEdit('${w.id}')" class="cartoon-btn bg-sky-200 hover:bg-sky-300 text-slate-800 px-2 rounded-xl text-[11px] sm:text-xs" title="Edit">
                ✏️

            </div>
          </div>
        `;

    function renderCategoryView() {
      clearSpeedTimer();
      setHomeBtnVisibility(true);
      isWaitingForNext = false;
      const categoryWords = getSelectedCategoryWords();
      const totalCatWordsCount = words.filter(w => w.categoryId === selectedCategory.id).length;

        headerTitleHtml = `
          <div class="flex items-center gap-2 w-full">

        `;

      container.innerHTML = `

            </div>
            <div id="wordListContainer" class="cartoon-card bg-white overflow-hidden">${buildWordListHtml(categoryWords)}</div>
          </div>
        </div>
      `;
    }

    function addWord(e) {
      e.preventDefault();
      playSound('correct');
      const german = document.getElementById('germanInput').value.trim();
      const english = document.getElementById('englishInput').value.trim();
      const example = document.getElementById('exampleInput').value.trim();

      if (german && english) {
        words.push({ id: Date.now().toString(), categoryId: selectedCategory.id, german, english, example, box: 1, nextReview: 0, attempts: 0, correct: 0, starred: false, conjugations: {} });
        saveData();
        renderCategoryView();
      }
    }

    function startEdit(id) {
      editingWordId = id;
      const categoryWords = getSelectedCategoryWords();
      const wordListContainer = document.getElementById('wordListContainer');
      if (wordListContainer) {
        wordListContainer.innerHTML = buildWordListHtml(categoryWords);
      }
    }

    function cancelEdit() {
      playSound('click');
      editingWordId = null;
      const categoryWords = getSelectedCategoryWords();
      const wordListContainer = document.getElementById('wordListContainer');
      if (wordListContainer) {
        wordListContainer.innerHTML = buildWordListHtml(categoryWords);
      }
    }

    function saveEdit(id) {
      playSound('correct');
      const gInput = document.getElementById(`editGerman_${id}`);
      const eInput = document.getElementById(`editEnglish_${id}`);
      const exInput = document.getElementById(`editExample_${id}`);
      if (gInput && eInput) {
        const german = gInput.value.trim();
        const english = eInput.value.trim();
        const example = exInput ? exInput.value.trim() : '';
        if (german && english) {
          const wordObj = words.find(w => w.id === id);
          if (wordObj) {
            wordObj.german = german;
            wordObj.english = english;
            wordObj.example = example;
            saveData();
          }
        }
      }
      editingWordId = null;
      renderCategoryView();
    }

    function deleteWord(id) {
      playSound('delete');
      words = words.filter(w => w.id !== id);
      saveData();
      renderCategoryView();
    }

    function setDirection(dir) {
      playSound('click');
      testDirection = dir;
      const btnDeEn = document.getElementById('btnDeEn');
      const btnEnDe = document.getElementById('btnEnDe');
      if (dir === 'de_en') {
        btnDeEn.className = 'cartoon-btn bg-amber-300 text-slate-900 text-xs sm:text-sm px-3 rounded-xl border-2';
        btnEnDe.className = 'cartoon-btn bg-white hover:bg-slate-100 text-slate-700 text-xs sm:text-sm px-3 rounded-xl border-2';
      } else {
        btnEnDe.className = 'cartoon-btn bg-amber-300 text-slate-900 text-xs sm:text-sm px-3 rounded-xl border-2';
        btnDeEn.className = 'cartoon-btn bg-white hover:bg-slate-100 text-slate-700 text-xs sm:text-sm px-3 rounded-xl border-2';
      }

      const catWords = words.filter(w => w.categoryId === selectedCategory.id);

      totalInitialCount = revisingQueue.length;
      revisingCurrentCard = null;
      testGameMode = 'revising';
      setHomeBtnVisibility(false);

      nextRevisingCard();

      playSound('click');
      autoAudioEnabled = !autoAudioEnabled;
      const toggleBtn = document.getElementById('autoAudioToggleBtn');
      if (toggleBtn) {
        toggleBtn.innerText = autoAudioEnabled ? '🔊 Audio: ON' : '🔇 Audio: OFF';
        toggleBtn.className = autoAudioEnabled 
          ? 'cartoon-btn bg-emerald-300 hover:bg-emerald-400 text-slate-900 px-2.5 py-1 rounded-xl text-xs font-bold'
          : 'cartoon-btn bg-slate-300 hover:bg-slate-400 text-slate-800 px-2.5 py-1 rounded-xl text-xs font-bold';
      }
    }

      if (revisingQueue.length === 0) {
        renderRevisingSummary();
        return;

      revisingCurrentCard = revisingQueue.shift();
      renderRevisingScreen();

        setTimeout(() => {
          speakGerman(revisingCurrentCard.german);
        }, 200);
      }

    let touchStartX = 0;
    let currentX = 0;
    let isDraggingCard = false;

    function startCardDrag(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
      isDraggingCard = true;
      touchStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      
      window.addEventListener('mousemove', onCardDrag);
      window.addEventListener('mouseup', endCardDrag);
      window.addEventListener('touchmove', onCardDrag);
      window.addEventListener('touchend', endCardDrag);
    }

    function onCardDrag(e) {
      if (!isDraggingCard) return;
      currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const diffX = currentX - touchStartX;
      const cardElem = document.getElementById('swipeCardElement');
      if (cardElem) {
        cardElem.style.transform = `translateX(${diffX}px) rotate(${diffX * 0.05}deg)`;
        if (diffX > 50) {
          cardElem.style.backgroundColor = '#d1fae5';
        } else if (diffX < -50) {
          cardElem.style.backgroundColor = '#ffe4e6';
        } else {
          cardElem.style.backgroundColor = '#fffbeb';
        }
      }
    }

    function endCardDrag(e) {
      if (!isDraggingCard) return;
      isDraggingCard = false;
      window.removeEventListener('mousemove', onCardDrag);
      window.removeEventListener('mouseup', endCardDrag);
      window.removeEventListener('touchmove', onCardDrag);
      window.removeEventListener('touchend', endCardDrag);

      const diffX = currentX - touchStartX;
      const cardElem = document.getElementById('swipeCardElement');

      if (diffX > 80) {
        if (cardElem) cardElem.style.transform = `translateX(400px) rotate(30deg)`;
        setTimeout(() => handleRevisingSwipe('right'), 150);
      } else if (diffX < -80) {
        if (cardElem) cardElem.style.transform = `translateX(-400px) rotate(-30deg)`;
        setTimeout(() => handleRevisingSwipe('left'), 150);
      } else {
        if (cardElem) {
          cardElem.style.transform = 'translateX(0px) rotate(0deg)';
          cardElem.style.backgroundColor = '#fffbeb';
        }
      }
    }

    function handleRevisingSwipe(direction) {
      const card = revisingCurrentCard;

      if (direction === 'right') {
        playSound('correct');
        updateWordSRS(card.id, true);
        if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 40, origin: { y: 0.6 } });
      } else {
        playSound('wrong');
        updateWordSRS(card.id, false);
        revisingQueue.push(card);

      if (!fullStr) return '';
      let cleaned = fullStr.replace(/^(der|die|das)\s+/i, '').trim();
      let primary = cleaned.split(/[/,;]+/)[0].trim();
      return primary;

      const defaultDistractors = ['to learn', 'to speak', 'to go', 'to have', 'to make', 'apple', 'bread', 'house', 'car'];
